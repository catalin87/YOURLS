name: PR to Markdown

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  convert-pr:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PR List
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "<!-- PR-LIST:START -->" > output.md
          
          # Extragem PR-urile direct din repository-ul curent folosind GitHub CLI
          gh pr list --state all --limit 50 --json number,title,url,state,author | node -e '
            const fs = require("fs");
            const prs = JSON.parse(fs.readFileSync(0, "utf-8"));
            
            let markdown = "\n";
            if (prs.length === 0) {
              markdown += "No pull requests found.\n";
            } else {
              prs.forEach(pr => {
                markdown += `- [${pr.state}] #${pr.number} **${pr.title}** (${pr.url}) - *${pr.author.login}*\n`;
              });
            }
            markdown += "\n<!-- PR-LIST:END -->";
            
            let fileContent = fs.readFileSync("output.md", "utf-8");
            fileContent = fileContent.replace(/<!-- PR-LIST:START -->[\s\S]*<!-- PR-LIST:END -->/, "<!-- PR-LIST:START -->" + markdown);
            fs.writeFileSync("output.md", fileContent);
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update PR list automatically"
          file_pattern: output.md
