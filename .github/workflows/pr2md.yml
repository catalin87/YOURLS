name: PR to Markdown

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  convert-pr:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PR to MD action
        uses: ryohidaka/action-pr-to-md@main
        with:
          user_name: 'catalin87'
          output_file_path: 'output.md'
          since: '2024-01-01'
          # Am scos linia cu states: 'open, merged, closed' care strica interogarea
