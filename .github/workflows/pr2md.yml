name: PR to Markdown

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  convert-pr:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PR Markdown Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Dacă workflow-ul e rulat manual, luăm cel mai recent PR, altfel folosیم numărul PR-ului curent
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --limit 1 --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No active PR found."
            exit 0
          fi

          echo "Generating report for PR #$PR_NUMBER..."

          # Creăm fișierul Markdown cu detaliile PR-ului și fișierele modificate (diff/file list)
          echo "# PR #$PR_NUMBER Report" > output.md
          echo "" >> output.md
          
          # Luăm titlul, corp și autorul
          gh pr view "$PR_NUMBER" --json title,body,author,url --jq '"## " + .title + "\n\n**Author:** " + .author.login + "\n\n**URL:** " + .url + "\n\n### Description\n" + (.body // "No description") + "\n\n"' >> output.md

          # Adăugăm lista fișierelor modificate și diff-ul pe scurt
          echo "### Modified Files" >> output.md
          echo "\`\`\`" >> output.md
          gh pr diff "$PR_NUMBER" --stat >> output.md
          echo "\`\`\`" >> output.md

      - name: Commit and push output.md safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output.md
          git diff --staged --quiet || git commit -m "docs: update PR report for #$PR_NUMBER"
          git push
