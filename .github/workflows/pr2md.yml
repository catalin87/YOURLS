name: PR to Markdown

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  convert-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PR Markdown Report & Raw Diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --limit 1 --json number --jq '.[0].number')
          fi

          # 1. Raport Markdown cu fișiere modificate
          echo "# PR #$PR_NUMBER Report" > output.md
          echo "" >> output.md
          gh pr view "$PR_NUMBER" --json title,body,author,url,files --jq '
            "## " + .title + "\n\n" +
            "**Author:** @" + .author.login + "\n\n" +
            "**URL:** " + .url + "\n\n" +
            "### Description\n" + (.body // "No description") + "\n\n" +
            "### Changed Files (" + (.files | length | tostring) + ")\n" +
            ([.files[].path] | map("- `" + . + "`") | join("\n"))
          ' >> output.md

          # 2. Diff-ul complet în format git patch / diff
          gh pr diff "$PR_NUMBER" > changes.diff

      - name: Upload Markdown and Diff Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-diff-export
          path: |
            output.md
            changes.diff
